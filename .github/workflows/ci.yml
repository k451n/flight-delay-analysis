name: Aviation Analytics CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Разрешения для Trivy (запись в Security-раздел)
permissions:
  contents: read
  security-events: write

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8
        if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
    - name: Lint with black
      run: black --check python/ || echo "Black found issues"
    - name: Lint with flake8
      run: flake8 python/ || echo "Flake8 found issues"

  build-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libomp-dev openmpi-bin libopenmpi-dev
    - name: Configure CMake
      run: |
        cd cpp
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: |
        cd cpp/build
        make -j$(nproc)
    - name: Run C++ Tests
      run: |
        cd cpp/build
        ctest --output-on-failure || echo "No tests yet"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-cpp
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
